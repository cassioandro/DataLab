<title>Tek Kat Plan Stüdyosu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e7eae6; --panel:#fbfbf9; --ink:#172120; --muted:#5f6c68; --line:#cdd4d0; --line-2:#e2e7e3;
  --accent:#24507a; --accent-ink:#ffffff; --warn:#a85f0a; --warn-bg:#fbf1e0; --ok:#2b7a4b;
  --sheet:#ffffff; --sheet-edge:#b9c2bd;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151b19; --panel:#1e2624; --ink:#e6ebe8; --muted:#97a39e; --line:#33403b; --line-2:#28322e;
    --accent:#8ab8e6; --accent-ink:#0e1a25; --warn:#e0a24a; --warn-bg:#2d2416; --ok:#6cc28f;
    --sheet:#ffffff; --sheet-edge:#3b4743;
  }
}
:root[data-theme="dark"]{
  --bg:#151b19; --panel:#1e2624; --ink:#e6ebe8; --muted:#97a39e; --line:#33403b; --line-2:#28322e;
  --accent:#8ab8e6; --accent-ink:#0e1a25; --warn:#e0a24a; --warn-bg:#2d2416; --ok:#6cc28f;
  --sheet:#ffffff; --sheet-edge:#3b4743;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100vh}
.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:600 20px/1 var(--f-display);margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:12.5px}
header .spacer{flex:1}
.btn{font:500 13px var(--f-body);padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
aside{border-right:1px solid var(--line);background:var(--panel);padding:16px 18px 28px;overflow-y:auto}
aside h2{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
aside h2:first-child{margin-top:0}
.field{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2)}
.field label{font-size:13px}
.field small{display:block;color:var(--muted);font-size:11.5px}
.field input[type=number],.field select{width:100%;font:500 13px var(--f-mono);padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.field input[type=checkbox]{justify-self:end;width:16px;height:16px;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;font:500 12px var(--f-body);padding:5px 0;border:0;background:var(--bg);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.warn{background:var(--warn-bg);color:var(--warn);border-left:3px solid var(--warn);padding:8px 10px;font-size:12.5px;margin:10px 0;border-radius:0 3px 3px 0}
.warn:empty{display:none}
table.prog{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.prog td{padding:3px 0;border-bottom:1px solid var(--line-2)}
table.prog td:last-child{text-align:right;font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
table.prog tr.total td{border-top:1px solid var(--line);border-bottom:0;font-weight:500}
table.prog tr.nolabel{display:none}
table.prog td .sw{display:inline-block;width:9px;height:9px;border:1px solid var(--sheet-edge);margin-right:6px;vertical-align:-1px}
main{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--sheet-edge);box-shadow:0 1px 0 var(--sheet-edge);height:calc(100vh - 150px);min-height:420px;position:relative}
.sheet svg{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted)}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.legend .sw{width:14px;height:3px;border-radius:1px}
.legend code{font:11.5px var(--f-mono);color:var(--muted)}
.legend input{accent-color:var(--accent)}
.status{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>

<div class="app">
<header>
  <div><h1>Tek Kat Plan Stüdyosu</h1><div class="sub">Parametrik program → şematik plan → katmanlı SVG / renk kodlu PDF / DXF</div></div>
  <div class="spacer"></div>
  <button class="btn" id="btnSvg">SVG indir</button>
  <button class="btn" id="btnDxf">DXF indir</button>
  <button class="btn primary" id="btnPdf">PDF indir (A3, 1:100)</button>
</header>

<aside>
  <h2>Program</h2>
  <div class="field"><label>Yatak odası sayısı<small>Ebeveyn dahil</small></label><select id="beds"><option value="1">1+1</option><option value="2">2+1</option><option value="3" selected>3+1</option><option value="4">4+1</option></select></div>
  <div class="field"><label>Mutfak</label><div class="seg" id="kitchen"><button data-v="closed">Kapalı</button><button data-v="open" class="on">Açık + ada</button></div></div>
  <div class="field"><label>Giriş<small>Uzun cephede, banyo yanında</small></label><div class="seg" id="side"><button data-v="left" class="on">Sol</button><button data-v="right">Sağ</button></div></div>

  <h2>Yapı (m)</h2>
  <div class="field"><label>Bina genişliği<small>Dar kenar, dış yüz. Mekân derinlikleri otomatik.</small></label><input type="number" id="W" min="8" max="13" step="0.1" value="10.0"></div>
  <div class="field"><label>Dış duvar kalınlığı</label><input type="number" id="te" min="0.15" max="0.5" step="0.05" value="0.25"></div>
  <div class="field"><label>İç duvar kalınlığı</label><input type="number" id="ti" min="0.08" max="0.25" step="0.01" value="0.10"></div>

  <h2>Çizim</h2>
  <div class="field"><label>Tefriş</label><input type="checkbox" id="furn" checked></div>
  <div class="field"><label>Oda dolguları</label><input type="checkbox" id="fills" checked></div>
  <div class="field"><label>Ölçü çizgileri</label><input type="checkbox" id="dims" checked></div>
  <div class="field"><label>Proje adı</label><input type="text" id="pname" value="Konut A" style="font:500 13px var(--f-mono);padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);width:100%"></div>

  <div class="warn" id="warn"></div>

  <h2>Mahal listesi</h2>
  <table class="prog" id="prog"></table>
</aside>

<main>
  <div class="sheet" id="sheet"></div>
  <div class="legend" id="legend"></div>
  <div class="status" id="status"></div>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- Katmanlar (AutoCAD ACI renk indeksleriyle eşleşir) ---------- */
const LAYERS = [
  {id:'A-AREA',     name:'Mahal dolgu', color:'#9aa4a0', aci:9, lw:0.09},
  {id:'A-FURN',     name:'Tefriş',      color:'#1e8f3c', aci:3, lw:0.13},
  {id:'A-WALL-EXT', name:'Dış duvar',   color:'#1b1b1b', aci:7, lw:0.35},
  {id:'A-WALL-INT', name:'İç duvar',    color:'#4a4a4a', aci:8, lw:0.25},
  {id:'A-DOOR',     name:'Kapı',        color:'#d11a1a', aci:1, lw:0.18},
  {id:'A-GLAZ',     name:'Pencere',     color:'#0a9cb3', aci:4, lw:0.18},
  {id:'A-ANNO',     name:'Mahal yazısı',color:'#1a3fbf', aci:5, lw:0.13},
  {id:'A-DIMS',     name:'Ölçü',        color:'#b81aa8', aci:6, lw:0.13},
];
const LAYER = Object.fromEntries(LAYERS.map(l=>[l.id,l]));
const ZONE_FILL = {day:'#f6ecd8', night:'#dfe8f4', wet:'#d9efe9', circ:'#efefe8'};

/* ---------- Durum ---------- */
const S = {beds:3, ens:true, kitchen:'open', side:'left', porch:true,   // en-suite + giyinme ve giriş nişi her planda var
  W:10.0, De:2.2, Dk:3.6, Dl:6.0, Db:3.6, Dm:4.2, c:1.3, te:0.25, ti:0.10,
  furn:true, fills:true, dims:true, pname:'Konut A', hidden:new Set()};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*100)/100;

/* ---------- Yerleşim algoritması ----------
   Şema (kuzey yukarı, giriş batı uzun cephede; "sağ" seçilirse plan aynalanır):
     ┌────────────────┬──┬───┐
     │ EBEVEYN        │gi│en-│  kuzey uç: yatak kapı duvarında, giyinme duvarsız, en-suite ince uzun
     │                │yi│sui│
     ├────────┬─┬─────┴──┴───┤
     │ Y.O.   │k│ Y.O.       │
     ├─┬───┬──┤o├────────────┤
     │Ç│WC │kk│r│  BANYO     │  batı servis hücresi: küçük koridor (kk) → WC kapısı gizli, çamaşır, dolap
   → ├─┴───┴──┤ ├────────────┤  banyo koridorun karşısında
     │ GİRİŞ  │K│  MUTFAK    │  hol–koridor kapılı; hol, mutfak, salon tek açık hacim; ada
     ├─ ─ ─ ─ ┴─┴─ ─ ─ ─ ─ ─┤
     │        SALON          │  güney uç, 10 kişilik masa mutfak tarafında
     └───────────────────────┘ */
function layout(p){
  const {W,te,ti,c}=p; const cellW=1.5; const pd=p.porch?cellW:0;   // niş derinliği = güneybatı servis hücresi genişliği (diş yapmaz)
  const x0=te, x1=W-te;
  const xc0=r2((W-c)/2), xc1=xc0+c;
  const xw0=x0, xw1=xc0-ti, xe0=xc1+ti, xe1=x1;
  const wSide=xw1-xw0;
  const yL0=te, yL1=yL0+p.Dl;
  const yE0=yL1+ti, yE1=yE0+p.De;
  const hallX=p.porch?pd+te:x0;
  const rooms=[], warnings=[];
  const living={id:'LIV',name:'Salon',zone:'day',x:x0,y:yL0,w:x1-x0,h:p.Dl};
  const hall={id:'ENT',name:'Giriş',zone:'circ',x:hallX,y:yE0,w:xc1-hallX,h:p.De};
  const sR=1.7, nR=2.2;                                                                           // servis hücresi: güney sıra 1.7, kuzey sıra 2.2 (banyo derinliğiyle eş)
  const Dk=p.De+ti+sR;                                                                            // mutfak kuzey duvarı, WC/çamaşır sırasının duvarıyla hizalı
  const kitchen={id:'KIT',name:p.kitchen==='open'?'Mutfak (açık)':'Mutfak',zone:'day',kind:'kitchen',side:'E',x:xe0,y:yE0,w:xe1-xe0,d:Dk};
  /* 2+1: banyo batı servis hücresine (KK ucunda), vestiyer/depo yok; doğu yığını mutfak + yatak odası.
     Diğer tipler: banyo doğuda koridorun karşısında; batı hücresi derinliği doğu yığınına (mutfak+banyo) eşitlenir. */
  const bathW=p.beds===2, oneBed=p.beds===1;                                                      // 1+1: ayrı ana banyo yok, süitin banyosu kullanılır
  const yS0=yE1+ti; const kkW=1.1, wcD=sR, bathD=nR;
  let bath, Ds;
  if(bathW||oneBed){ Ds=sR+ti+nR; }                                                                 // 2+1 banyo bandı / 1+1 WC + çamaşır sırası
  else { bath={id:'BTH',name:'Banyo',zone:'wet',kind:'bath',side:'E',x:xe0,y:yE0+Dk+ti,w:xe1-xe0,d:nR}; Ds=sR+ti+nR; }
  const hasUp=!bathW&&(Ds-wcD-ti>=1.3);
  if(oneBed) bath=null;
  // güney sıra (her tipte): batı hücre | küçük koridor (KK, min 1.1) | Vestiyer (duvarsız niş), KK ucunda dolap
  // kuzey sıra: normalde Çamaşır (batı, pencereli) + WC (doğu); 2+1'de banyo bandı, çamaşır banyonun kuzeydoğu nişinde
  const sD=bathW?sR:Ds;                                                                            // servis hücresinin güney sırası
  let kk=null, clo=null, vest, depo=null, laundry=null, wcR;
  if(bathW){
    // 2+1: alt sıra WC + Vestiyer (holden), üstünde ana banyo tam genişlikte; küçük koridor gerekmez
    vest={id:'VST',name:'Vestiyer',zone:'circ',kind:'vest',x:xw0+2.0+ti,y:yS0,w:xw1-(xw0+2.0+ti),h:sD};
    wcR={id:'WC',name:'WC',zone:'wet',kind:'wc',x:xw0,y:yS0,w:2.0,h:sD};
    bath={id:'BTH',name:'Banyo',zone:'wet',kind:'bath',side:'W',x:xw0,y:yS0+sD+ti,w:wSide,d:bathD};             // dış duvardan koridora
    laundry={id:'CMS',name:'Çamaşır',zone:'wet',kind:'laundry',x:xw1-0.95,y:bath.y+bathD-0.9,w:0.95,h:0.9};     // banyonun kuzeydoğu nişi
  } else {
    kk={id:'KK',name:'',zone:'circ',kind:'minihall',x:xw0+cellW+ti,y:yS0,w:kkW,h:sD-0.6};
    clo={id:'DLP',name:'Dolap',zone:'circ',kind:'closet',x:kk.x,y:yS0+sD-0.6,w:kkW,h:0.6};
    vest={id:'VST',name:'Vestiyer',zone:'circ',kind:'vest',x:kk.x+kkW,y:yS0,w:xw1-(kk.x+kkW),h:hasUp?wcD:sD};
    depo=hasUp?{id:'DPO',name:'Depo',zone:'circ',kind:'store2',x:xw0,y:yS0,w:cellW,h:wcD}:null;
    laundry=hasUp?{id:'CMS',name:'Çamaşır',zone:'wet',kind:'laundry',x:vest.x,y:yS0+wcD+ti,w:vest.w,h:Ds-wcD-ti}:null;   // kuzeydoğu hücre, KK'dan
    wcR=hasUp?{id:'WC',name:'WC',zone:'wet',kind:'wc',x:xw0,y:yS0+wcD+ti,w:cellW,h:Ds-wcD-ti}                            // kuzeybatı hücre, dış duvarda (pencereli)
             :{id:'WC',name:'WC',zone:'wet',kind:'wc',x:xw0,y:yS0,w:cellW,h:Ds};
  }
  const svc={id:'SVC',kind:'service',side:'W',x:xw0,y:yS0,w:wSide,d:Ds,hidden:true};
  rooms.push(living,hall,kitchen,wcR,vest); if(bath) rooms.push(bath); if(kk) rooms.push(kk,clo); if(laundry) rooms.push(laundry); if(depo) rooms.push(depo);
  const eBath=!!(bath&&bath.side==='E');
  const st={W:{rooms:[svc],len:(yS0+Ds)-yE0,x:xw0,w:wSide},E:{rooms:eBath?[kitchen,bath]:[kitchen],len:eBath?(bath.y+bath.d)-yE0:Dk,x:xe0,w:xe1-xe0}};
  const put=(side,it)=>{ const s=st[side]; it.side=side; it.x=s.x; it.w=s.w; it.y=yE0+s.len+ti; s.len=(it.y-yE0)+it.d; s.rooms.push(it); };
  const shorter=()=>st.W.len<=st.E.len?'W':'E';
  for(let i=2;i<=p.beds;i++) put(shorter(),{id:'BR'+i,name:'Yatak Odası '+i,zone:'night',kind:'bed',d:p.Db});
  const diff=Math.abs(st.W.len-st.E.len);
  let stepSide=null;
  if(diff>0.01){
    const sh=shorter(), s=st[sh], last=s.rooms[s.rooms.length-1];
    if(diff<0.6){ last.d+=diff; s.len+=diff; }
    else if(diff<2.1||last.kind!=='bed') stepSide=sh;                                          // artan derinlik ebeveyne çıkma olur (L)
    else {
      // ikinci süit: son oda 0.6'ya kadar büyür, kalan bant = en-suite (dış duvarda, pencereli) + giyinme (koridor tarafında)
      const roomExtra=clamp(diff-ti-3.0,0,0.6); last.d+=roomExtra; s.len+=roomExtra;
      const band={id:'SU2',kind:'suite2',d:diff-ti-roomExtra,hidden:true}; put(sh,band);
      const we=Math.min(2.4,band.w-1.4), ext=sh==='E';
      band.ens={id:'EN2',name:'Banyo 2',zone:'wet',kind:'ensuite2',x:ext?band.x+band.w-we:band.x,y:band.y,w:we,h:band.d,side:sh};
      band.clo={id:'GY2',name:'Giyinme',zone:'night',kind:'closet2',x:ext?band.x:band.x+we+ti,y:band.y,w:band.w-we-ti,h:band.d,side:sh};
      last.suite=band;
    }
  }
  /* --- koridor kapıları: karşılıklı açılmasın; süitli odanın kapısı süit tarafında --- */
  const dSpan=(r,north)=>north?[r.y+r.d-1.4,r.y+r.d-0.5]:[r.y+0.5,r.y+1.4];
  const ovl=(a,b)=>a[0]<b[1]-0.05&&b[0]<a[1]-0.05;
  const placed=[];
  [...st.W.rooms,...st.E.rooms].filter(r=>r.kind==='bed'||r.kind==='study')
    .sort((a,b)=>(b.suite?1:0)-(a.suite?1:0)||a.y-b.y).forEach(r=>{                              // süitli oda önce yerleşir
    let n=r.suite?true:(r.side==='W');
    const bad=v=>placed.some(d=>d.side!==r.side&&ovl(dSpan(r,v),d.span));
    if(bad(n)&&!bad(!n)) n=!n;
    r.doorN=n; placed.push({side:r.side,span:dSpan(r,n)});
  });
  const Lc=Math.max(st.W.len,st.E.len);
  /* --- ebeveyn L çıkması: kısa yığının üstündeki artan, ebeveyn odasına eklenir; kuzey bant o kadar kısalır --- */
  const yM0=yE0+Lc+ti;
  const stepD=stepSide?Lc-st[stepSide].len:0;
  const suiteToStep=p.ens&&stepSide==='W';                                                       // süit kanadı batıda: batıdaki artan süite gider
  const Dm=Math.max(3.0,p.Dm-stepD);
  const yM1=yM0+Dm, D=yM1+te;
  const step=(stepSide&&!suiteToStep)?{id:'BR1S',name:'',zone:'night',kind:'masterstep',
    x:stepSide==='W'?xw0:xe0,w:stepSide==='W'?xw1-xw0:xe1-xe0,y:yM0-ti-stepD,h:stepD}:null;
  const ySuite=suiteToStep?yM0-ti-stepD:yM0;                                                     // süit bandının güney sınırı
  const corridor={id:'COR',name:'Koridor',zone:'circ',x:xc0,y:yE1+ti,w:c,h:yM0-ti-(yE1+ti)};
  /* --- ebeveyn: yatak alanı | giyinme (duvarsız) | en-suite (ince uzun), hepsi tam derinlik --- */
  /* süit kanadı (giyinme + banyo) her planda batıda; ebeveyn | giyinme duvarı koridorun batı yüzüne hizalı */
  const suiteW=p.ens;
  let xEns, xDrs, wEns, wDrs, mx0, mx1;
  if(!p.ens){ xEns=xDrs=x1; wEns=wDrs=0; mx0=x0; mx1=x1; }
  else { const avail=xc0-ti-x0;
    wEns=clamp(oneBed?2.2:1.8,1.4,avail-ti-1.4); xEns=x0; xDrs=x0+wEns+ti; wDrs=avail-wEns-ti; mx0=xc0; mx1=x1; }
  const master={id:'BR1',name:oneBed?'Yatak Odası':'Ebeveyn Y.O.',zone:'night',kind:'master',x:mx0,y:yM0,w:mx1-mx0,h:Dm,step:step};
  const stackRooms=s=>s.rooms.flatMap(r=>r.kind==='suite2'?[r.ens,r.clo]:(r.hidden||r.kind==='kitchen'||r.kind==='bath')?[]:[r]);
  rooms.push(corridor,...stackRooms(st.W),...stackRooms(st.E),master); if(step) rooms.push(step);
  let dress=null, ens=null;
  if(p.ens){
    dress={id:'DRS',name:'Giyinme',zone:'night',kind:'dress',x:xDrs,y:ySuite,w:r2(wDrs),h:yM1-ySuite};
    ens={id:'ENS',name:oneBed?'Banyo':'Eb. Banyo',zone:'wet',kind:'ensuite',x:xEns,y:ySuite,w:wEns,h:yM1-ySuite};
    rooms.push(dress,ens);
  }
  rooms.forEach(r=>{ if(r.d!=null) r.h=r.d; r.area=r2(r.w*r.h); });
  if(step) master.area=r2(master.area+step.area);

  if(wSide<3.2) warnings.push(`Yan yatak odaları çok dar (${r2(wSide)} m). Bina genişliğini artırın.`);
  if(wSide>4.6) warnings.push(`Yan odalar gereksiz geniş (${r2(wSide)} m). Bina genişliğini azaltın.`);
  if(p.Dl<5.2) warnings.push('10 kişilik masa için salon derinliği en az 5.2 m olmalı.');
  if(master.w<4.6) warnings.push(`Ebeveyn yatak alanı dar (${r2(master.w)} m). Bina genişliğini artırın.`);
  if(p.ens&&wDrs<1.4) warnings.push(`Giyinme dar (${r2(wDrs)} m). Bina genişliğini artırın.`);
  if(vest&&vest.w<0.9) warnings.push('Vestiyer çok dar; bina genişliğini artırın.');
  if(kitchen.w<3.8||Dk<3.4) warnings.push(`Ada için mutfak en az 3.8 × 3.4 m olmalı (${r2(kitchen.w)} m); ada çizilmedi.`);
  if(D/W>2.6) warnings.push(`Plan çok uzun (${r2(D)} m). Genişliği artırmak koridoru kısaltır.`);
  return {rooms,warnings,D,W,pd,x0,x1,xc0,xc1,xw0,xw1,xe0,xe1,yL0,yL1,yE0,yE1,yS0,Ds,sD,kk,clo,wcR,vest,laundry,depo,hasUp,bathW,oneBed,suiteW,step,ySuite,suiteToStep,Dm,Lc,yM0,yM1,xDrs,xEns,wDrs,wEns,st,hall,living,bath,kitchen,master,dress,ens,corridor,hallX};
}

/* ---------- Geometri → ilkeller (metre, y yukarı) ---------- */
function build(p){
  const L=layout(p); const {W,te,ti,c}=p; const {D,pd}=L; const cellW=1.5, wcD=1.7, nR=2.2;
  const P=[];
  const rect=(l,x,y,w,h,fill,extra)=>P.push(Object.assign({k:'rect',l,x,y,w,h,fill:!!fill,white:l==='A-FURN'&&!fill},extra||{}));   // tefriş: beyaz dolgu
  const line=(l,x1,y1,x2,y2,extra)=>P.push(Object.assign({k:'line',l,x1,y1,x2,y2},extra||{}));
  const dash=(l,x1,y1,x2,y2)=>line(l,x1,y1,x2,y2,{dash:true});
  const arc=(l,cx,cy,r,a0,a1)=>P.push({k:'arc',l,cx,cy,r,a0,a1});
  const circle=(l,cx,cy,r)=>P.push({k:'circle',l,cx,cy,r,white:l==='A-FURN'});
  const text=(l,x,y,s,t,anchor,rot)=>P.push({k:'text',l,x,y,s,t,anchor:anchor||'middle',rot:rot||0});

  const walls=[];
  const wall=(l,dir,x,y,len,t,openings)=>{ const w={l,dir,x,y,len,t,op:openings||[]}; walls.push(w); return w; };
  function emitWalls(){
    walls.forEach(w=>{
      const ops=[...w.op].sort((a,b)=>a.at-b.at); let cur=0;
      const seg=(a,b)=>{ if(b-a<=0.001) return; if(w.dir==='h') rect(w.l,w.x+a,w.y,b-a,w.t,true); else rect(w.l,w.x,w.y+a,w.t,b-a,true); };
      ops.forEach(o=>{ seg(cur,o.at); cur=o.at+o.w; }); seg(cur,w.len);
      ops.forEach(o=>{
        const ax=w.dir==='h'?w.x+o.at:w.x, ay=w.dir==='h'?w.y:w.y+o.at;
        const jamb=()=>{ if(w.dir==='h'){ line('A-DOOR',ax,w.y,ax,w.y+w.t); line('A-DOOR',ax+o.w,w.y,ax+o.w,w.y+w.t); } else { line('A-DOOR',w.x,ay,w.x+w.t,ay); line('A-DOOR',w.x,ay+o.w,w.x+w.t,ay+o.w); } };
        if(o.kind==='window'){
          if(w.dir==='h'){ [0,0.4,0.6,1].forEach(f=>line('A-GLAZ',ax,ay+w.t*f,ax+o.w,ay+w.t*f)); }
          else { [0,0.4,0.6,1].forEach(f=>line('A-GLAZ',ax+w.t*f,ay,ax+w.t*f,ay+o.w)); }
        } else if(o.kind==='door'){
          const s=o.swing, face=s>0?(w.dir==='h'?w.y+w.t:w.x+w.t):(w.dir==='h'?w.y:w.x);
          let hx,hy,ux,uy,nx,ny;
          if(w.dir==='h'){ hy=face; ny=s; nx=0; uy=0; if(o.hinge==='b'){hx=ax+o.w; ux=-1;} else {hx=ax; ux=1;} }
          else { hx=face; nx=s; ny=0; ux=0; if(o.hinge==='b'){hy=ay+o.w; uy=-1;} else {hy=ay; uy=1;} }
          line('A-DOOR',hx,hy,hx+nx*o.w,hy+ny*o.w); jamb();
          if(o.glass) line('A-GLAZ',hx+ux*0.05,hy+uy*0.05,hx+ux*0.05+nx*o.w,hy+uy*0.05+ny*o.w);        // camlı kanat
          const aN=Math.atan2(ny,nx)*180/Math.PI, aU=Math.atan2(uy,ux)*180/Math.PI;
          let a0=aN,a1=aU; const d=((a1-a0)%360+360)%360; if(d>180){ [a0,a1]=[a1,a0]; }
          arc('A-DOOR',hx,hy,o.w,a0,a1);
        } else if(o.kind==='open') jamb();
      });
    });
  }

  const {x0,x1,xc0,xc1,xw0,xw1,xe0,xe1,yL0,yL1,yE0,yE1,yS0,Ds,sD,kk,clo,wcR,vest,laundry,depo,hasUp,bathW,oneBed,suiteW,step,ySuite,suiteToStep,Dm,Lc,yM0,yM1,xDrs,xEns,wDrs,wEns,st,hall,living,bath,kitchen,master,dress,ens,corridor,hallX}=L;
  const ctr=(a,len,ww)=>a+(len-ww)/2;
  const open=p.kitchen==='open';

  /* --- dış duvarlar --- */
  const south=wall('A-WALL-EXT','h',0,0,W,te);
  const north=wall('A-WALL-EXT','h',0,D-te,W,te);
  const east=wall('A-WALL-EXT','v',W-te,0,D,te);
  let westS, westN, westH;
  if(pd>0){
    westS=wall('A-WALL-EXT','v',0,0,yE0,te);
    westN=wall('A-WALL-EXT','v',0,yE1,D-yE1,te);
    westH=wall('A-WALL-EXT','v',pd,yE0-ti,p.De+2*ti,te);
    rect('A-WALL-EXT',0,yE0-te,pd+te,te,true); rect('A-WALL-EXT',0,yE1,pd+te,te,true);
  } else { westS=westN=westH=wall('A-WALL-EXT','v',0,0,D,te); }
  const wAt=(w,y)=>y-w.y;
  westH.op.push({at:wAt(westH,ctr(yE0,p.De,1.0)),w:1.0,kind:'door',swing:+1,hinge:'b'});   // giriş kapısı, menteşe kuzeyde
  const lw2=Math.min(2.2,(living.w-1.8)/2);
  south.op.push({at:ctr(x0,living.w/2,lw2),w:lw2,kind:'window'}); south.op.push({at:ctr(x0+living.w/2,living.w/2,lw2),w:lw2,kind:'window'});
  const lwv=Math.min(2.4,living.h-1.4);
  east.op.push({at:ctr(yL0,living.h,lwv),w:lwv,kind:'window'});
  east.op.push({at:ctr(kitchen.y,kitchen.d,1.8),w:1.8,kind:'window'});                       // mutfak evye penceresi
  if(bath&&!bathW) east.op.push({at:ctr(bath.y,bath.d,0.6),w:0.6,kind:'window'});            // banyo
  westN.op.push({at:wAt(westN,ctr(wcR.y,wcR.h,0.5)),w:0.5,kind:'window'});                   // WC batı dış duvarında
  if(bathW) westN.op.push({at:wAt(westN,ctr(bath.y,bath.d,0.8)),w:0.8,kind:'window'});       // 2+1 banyosu batı dış duvarında
  const winFor=k=>k==='bed'||k==='study'?1.6:0;
  st.W.rooms.forEach(r=>{ if(r.kind==='suite2') westN.op.push({at:wAt(westN,ctr(r.ens.y,r.ens.h,0.6)),w:0.6,kind:'window'}); else if(!r.hidden){ const ww=Math.min(winFor(r.kind),r.d-0.8); if(ww>0) westN.op.push({at:wAt(westN,ctr(r.y,r.d,ww)),w:ww,kind:'window'}); } });
  st.E.rooms.forEach(r=>{ if(r.kind==='suite2') east.op.push({at:ctr(r.ens.y,r.ens.h,0.6),w:0.6,kind:'window'}); else if(r.kind!=='kitchen'&&r.kind!=='bath'){ const ww=Math.min(winFor(r.kind),r.d-0.8); if(ww>0) east.op.push({at:ctr(r.y,r.d,ww),w:ww,kind:'window'}); } });
  const mDoorX=Math.max(xc0+(c-0.9)/2,master.x+0.15);
  const bedC=step?step.x+step.w/2:mDoorX+0.9+0.75+0.9;                                       // ebeveyn yatak ekseni (çıkma varsa çıkmanın ortası, yoksa kapının doğusunda)
  const mw=Math.min(2.4,2*(bedC-master.x-0.4),2*(master.x+master.w-bedC-0.4)); north.op.push({at:bedC-mw/2,w:mw,kind:'window'});   // pencere yatağı ortalar
  if(ens) (suiteW?westN:east).op.push({at:suiteW?wAt(westN,ctr(ens.y,ens.h,0.6)):ctr(ens.y,ens.h,0.6),w:0.6,kind:'window'});   // lavabo üstü

  /* --- iç duvarlar --- */
  // hol kuzey duvarı: vestiyer kapısı, küçük koridor açıklığı, koridor kapısı
  wall('A-WALL-INT','h',x0,yE1,xc1-x0,ti,[
    {at:(kk?kk.x:vest.x)-x0,w:(kk?kk.w:vest.w),kind:'open'},                                    // küçük koridor / vestiyer açıklığı
    {at:(xc0+(c-0.9)/2)-x0,w:0.9,kind:'door',swing:+1,hinge:'b'}]);
  // servis hücresi: KK'nın batı duvarı (WC, çamaşır); doğuda vestiyer nişi duvarsız, üstünde depo duvarlı
  if(kk){
    { const cells=hasUp?[[depo,0.8],[wcR,0.7]]:[[wcR,0.7]];                                                   // KK batı duvarı: hücre kapıları
      wall('A-WALL-INT','v',kk.x-ti,yS0,sD,ti,cells.filter(c=>c[0]).map((c,i)=>({at:(c[0].y-yS0)+0.3,w:c[1],kind:'door',swing:-1,hinge:i?'a':'b'}))); }
    if(hasUp){
      wall('A-WALL-INT','v',kk.x+kk.w,laundry.y-ti,Ds-wcD,ti,[{at:ti+0.3,w:0.8,kind:'door',swing:+1,hinge:'a'}]);   // çamaşır kapısı (KK'dan)
      wall('A-WALL-INT','h',xw0,yS0+wcD,cellW,ti); wall('A-WALL-INT','h',vest.x,yS0+wcD,vest.w,ti);
    }
  } else {
    wall('A-WALL-INT','v',wcR.x+wcR.w,yS0,sD,ti,[{at:0.3,w:0.7,kind:'door',swing:-1,hinge:'a'}]);             // WC kapısı vestiyerden (girişten görünmez)
    wall('A-WALL-INT','h',xw0,bath.y-ti,xw1-xw0,ti);                                                          // servis sırası | banyo
    wall('A-WALL-INT','v',laundry.x-ti,laundry.y,laundry.h,ti);                                               // çamaşır nişi
    wall('A-WALL-INT','h',laundry.x,laundry.y-ti,laundry.w,ti,[{at:0.05,w:laundry.w-0.1,kind:'open'}]);       // niş ağzı (katlanır dolap kapağı)
  }
  // mutfak | hol: duvar, kapısı salona yakın (güney) uçta; kapalı mutfakta salona servis penceresi
  wall('A-WALL-INT','v',xc1,yE0,p.De,ti,[{at:0.15,w:0.9,kind:'door',swing:+1,hinge:'a'}]);
  if(!open) wall('A-WALL-INT','h',xe0,yL1,xe1-xe0,ti,[{at:ctr(0,kitchen.w,Math.min(1.8,kitchen.w-1.0)),w:Math.min(1.8,kitchen.w-1.0),kind:'window'}]);
  else dash('A-FURN',xe0,yL1+ti/2,xe1,yL1+ti/2);
  // hol | salon: iki uçta dolu duvar, ortada çift camlı kapı (salona açılır)
  { const dw=clamp(hall.w-2.0,1.4,2.4), so=(hall.w-dw)/2;
    wall('A-WALL-INT','h',hallX,yL1,hall.w,ti,[{at:so,w:dw/2,kind:'door',swing:-1,hinge:'a',glass:true},{at:so+dw/2,w:dw/2,kind:'door',swing:-1,hinge:'b',glass:true}]); }
  if(bath&&bath.side==='E') wall('A-WALL-INT','h',xe0,kitchen.y+kitchen.d,xe1-xe0,ti);        // mutfak | banyo
  // koridor duvarları
  const corE=wall('A-WALL-INT','v',xc1,yE1,yM0-ti-yE1,ti);
  const corW=wall('A-WALL-INT','v',xw1,yS0,yM0-ti-yS0,ti);

  if(bath&&!bathW) corE.op.push({at:(bath.y-corE.y)+bath.d-0.15-0.8,w:0.8,kind:'door',swing:+1,hinge:'b'});   // banyo kapısı koridordan (doğu duvarı)
  else if(bathW) corW.op.push({at:(bath.y-corW.y)+0.05,w:0.8,kind:'door',swing:-1,hinge:'b'});                    // 2+1: banyo kapısı koridordan, çamaşır nişinin altında
  // ebeveyn güney duvarı: kapı koridor hizasında, menteşe doğuda; L çıkması varsa duvar çıkmanın yanından başlar
  { const a=step&&step.x===xw0?xw1:x0, b=step&&step.x===xe0?xe0:x1;
    wall('A-WALL-INT','h',a,yM0-ti,b-a,ti,[{at:mDoorX-a,w:0.9,kind:'door',swing:+1,hinge:'a'}]);              // kapı ebeveyn bandının içinde, menteşe batıda
    if(step) wall('A-WALL-INT','h',step.x,step.y-ti,step.w,ti);                                               // ebeveyn çıkmasının güney duvarı
    if(suiteToStep) wall('A-WALL-INT','h',x0,ySuite-ti,xw1-x0,ti); }                                          // süit çıkmasının güney duvarı
  [[st.W,corW,-1],[st.E,corE,+1]].forEach(([s,cw,sw])=>{
    s.rooms.forEach((r,i)=>{
      const nxt=s.rooms[i+1];
      if(nxt&&nxt.kind==='suite2'){ const e=nxt.ens, g=nxt.clo;                                          // oda → banyo 2 ve giyinme kapıları
        wall('A-WALL-INT','h',r.x,r.y+r.d,r.w,ti,[{at:(e.side==='E'?e.x+0.15:e.x+e.w-0.95)-r.x,w:0.8,kind:'door',swing:+1,hinge:e.side==='E'?'a':'b'},{at:g.x+ctr(0,g.w,0.8)-r.x,w:0.8,kind:'door',swing:+1,hinge:'a'}]);
        wall('A-WALL-INT','v',e.side==='E'?e.x-ti:e.x+e.w,e.y,e.h,ti); }
      else if(i<s.rooms.length-1 && r.kind!=='kitchen' && !(nxt&&nxt.kind==='suite2')) wall('A-WALL-INT','h',r.x,r.y+r.d,r.w,ti);
      if(r.kind==='bed'||r.kind==='study') cw.op.push(r.doorN                                     // kapı ucu layout'ta seçilir (karşılıklı açılmaz)
        ? {at:(r.y-cw.y)+r.d-0.5-0.9,w:0.9,kind:'door',swing:sw,hinge:'b'}
        : {at:(r.y-cw.y)+0.5,w:0.9,kind:'door',swing:sw,hinge:'a'});
      else if(r.kind==='store') cw.op.push({at:(r.y-cw.y)+r.d-0.15-0.8,w:0.8,kind:'door',swing:sw,hinge:'b'});
    });
  });
  if(ens){
    { const hS=ens.h;
      wall('A-WALL-INT','v',xEns+wEns,ySuite,hS,ti,[{at:(hS-0.8)/2,w:0.8,kind:'door',swing:-1,hinge:'a'}]);    // giyinme → banyo, ortadan
      wall('A-WALL-INT','v',xDrs+wDrs,ySuite,hS,ti,[{at:(hS-1.5)/2,w:1.5,kind:'open'}]); }                    // ebeveyn | giyinme: duvar, ortada 1.5 açıklık
    wall('A-GLAZ','h',ens.x,ens.y+ens.h-1.0-0.04,ens.w,0.04,[{at:ens.w-0.75,w:0.65,kind:'door',swing:-1,hinge:'b'}]);   // klozet kabini: cam bölme + kapı
  }
  emitWalls();

  /* --- mahal dolguları & yazılar --- */
  L.rooms.forEach(r=>{
    if(p.fills) rect('A-AREA',r.x,r.y,r.w,r.h,false,{fillColor:ZONE_FILL[r.zone]});
    if(!r.name) return;
    const cxm=r.x+r.w/2, cym=r.y+r.h/2;
    if(r.id==='COR'||r.id==='ENS'||(r.id==='EN2'&&r.h>r.w*1.3)){ text('A-ANNO',cxm,cym,0.2,`${r.name} ${r.area} m²`,'middle',90); return; }
    const small=r.w<2.0||r.h<2.0;
    if(r.kind==='store'||r.kind==='store2'||r.kind==='closet'){ text('A-ANNO',cxm,cym-0.06,0.16,r.kind==='closet'?r.name:`${r.name} ${r.area} m²`); return; }
    text('A-ANNO',cxm,cym+(small?0.05:0.18),small?0.2:0.26,r.name);
    if(r.step){ text('A-ANNO',cxm,cym-0.18,0.2,`${r.area} m²`); return; }
    if(!small){ text('A-ANNO',cxm,cym-0.12,0.18,`${r2(r.w)} × ${r2(r.h)}`); text('A-ANNO',cxm,cym-0.38,0.2,`${r.area} m²`); }
    else text('A-ANNO',cxm,cym-0.22,0.16,`${r.area} m²`);
  });

  /* --- tefriş --- */
  if(p.furn){
    const F='A-FURN';
    function frame(r,code,flip){ // flip: yerel y aynalanır (baş duvarı kuzeyde)
      let lw,lh,map; const Y=y=>flip?r.y+r.h-y:r.y+y;
      if(code==='E'){ lw=r.w; lh=r.h; map=(x,y)=>[r.x+x,Y(y)]; }
      else if(code==='W'){ lw=r.w; lh=r.h; map=(x,y)=>[r.x+r.w-x,Y(y)]; }
      else { lw=r.h; lh=r.w; map=(x,y)=>[r.x+y,r.y+r.h-x]; }
      const box=(x,y,w,h)=>{ const [a,b]=map(x,y),[c2,d2]=map(x+w,y+h); rect(F,Math.min(a,c2),Math.min(b,d2),Math.abs(c2-a),Math.abs(d2-b),false); };
      const ln=(x1,y1,x2,y2)=>{ const [a,b]=map(x1,y1),[c2,d2]=map(x2,y2); line(F,a,b,c2,d2); };
      const circ=(x,y,rr)=>{ const [a,b]=map(x,y); circle(F,a,b,rr); };
      return {lw,lh,box,ln,circ};
    }
    // lavabo: 60×100 kutu, ortasında r=20 daire. (x,y) kutunun sol-alt köşesi, along='x' kutu x boyunca 1.0 uzun
    const toilet=(cx,cy,dx,dy)=>{ // (cx,cy) duvar teması, (dx,dy) odaya doğru normal; rezervuar + oval çanak
      if(dy){ rect(F,cx-0.2,dy>0?cy:cy-0.18,0.4,0.18,false); circle(F,cx,cy+dy*0.45,0.19); line(F,cx-0.17,cy+dy*0.18,cx-0.19,cy+dy*0.45); line(F,cx+0.17,cy+dy*0.18,cx+0.19,cy+dy*0.45); }
      else { rect(F,dx>0?cx:cx-0.18,cy-0.2,0.18,0.4,false); circle(F,cx+dx*0.45,cy,0.19); line(F,cx+dx*0.18,cy-0.17,cx+dx*0.45,cy-0.19); line(F,cx+dx*0.18,cy+0.17,cx+dx*0.45,cy+0.19); } };
    const shower=(x,y,w,h,glass)=>{ // tekne + süzgeç + cam panel (glass: açık kenar)
      rect(F,x,y,w,h,false); rect(F,x+0.05,y+0.05,w-0.1,h-0.1,false); circle(F,x+w/2,y+h/2,0.04);
      const g=0.04; if(glass==='N') line(F,x,y+h+g,x+w,y+h+g); else if(glass==='S') line(F,x,y-g,x+w,y-g); else if(glass==='W') line(F,x-g,y,x-g,y+h); else if(glass==='E') line(F,x+w+g,y,x+w+g,y+h); };
    const mat=(x,y,w,h)=>{ dash(F,x,y,x+w,y); dash(F,x+w,y,x+w,y+h); dash(F,x+w,y+h,x,y+h); dash(F,x,y+h,x,y); };
    const basinW=(x,y,along)=>{ const w=along==='x'?1.0:0.6, h=along==='x'?0.6:1.0; rect(F,x,y,w,h,false); circle(F,x+w/2,y+h/2,0.2); };
    function bedroom(f,doorY,noShelf){ // baş y=0 duvarında, yatak pencere duvarından ≥0.7, gardırop kapı duvarında, karşı raf y=lh'de
      const {lw,lh,box,ln}=f;
      const dbl=lw>=3.2; const bw=dbl?1.6:1.0; const bx=0.75;

/* ---------- SVG çıktısı (katman grupları id'li) ---------- */
function toSVG(model, opts){
  const {P,D,W}=model; const m=2.0; // kenar boşluğu (m)
  const vb=`${-m} ${-m} ${W+2*m} ${D+2*m}`;
  const Y=y=>D-y;
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const groups={};
  P.forEach(q=>{ (groups[q.l]=groups[q.l]||[]).push(q); });
  let out='';
  LAYERS.forEach(Ld=>{
    const items=groups[Ld.id]; if(!items) return;
    const hidden = !opts.export && S.hidden.has(Ld.id);
    const sw=Ld.lw/100*3; // mm çizgi kalınlığı → m ölçek (1:100 kağıtta okunur kalınlık)
    let g=`<g id="${Ld.id}" data-name="${esc(Ld.name)}" stroke="${Ld.color}" fill="none" stroke-width="${sw}" stroke-linecap="square"${hidden?' display="none"':''}>`;
    items.forEach(q=>{
      switch(q.k){
        case 'rect': g+=`<rect x="${q.x}" y="${Y(q.y+q.h)}" width="${q.w}" height="${q.h}"${q.fill?` fill="${Ld.color}" stroke="none"`:q.fillColor?` fill="${q.fillColor}" stroke="none"`:q.white?' fill="#ffffff"':''}/>`; break;
        case 'line': g+=`<line x1="${q.x1}" y1="${Y(q.y1)}" x2="${q.x2}" y2="${Y(q.y2)}"${q.dash?' stroke-dasharray="0.15 0.1"':''}/>`; break;
        case 'circle': g+=`<circle cx="${q.cx}" cy="${Y(q.cy)}" r="${q.r}"${q.white?' fill="#ffffff"':''}/>`; break;
        case 'arc': { const a0=q.a0*Math.PI/180,a1=q.a1*Math.PI/180; const x1=q.cx+q.r*Math.cos(a0),y1=q.cy+q.r*Math.sin(a0),x2=q.cx+q.r*Math.cos(a1),y2=q.cy+q.r*Math.sin(a1);
          g+=`<path d="M${x1} ${Y(y1)} A${q.r} ${q.r} 0 0 0 ${x2} ${Y(y2)}"/>`; break; }
        case 'text': g+=`<text x="${q.x}" y="${Y(q.y)}" font-size="${q.s}" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" fill="${Ld.color}" stroke="none" text-anchor="${q.anchor}"${q.rot?` transform="rotate(${-q.rot} ${q.x} ${Y(q.y)})"`:''}>${esc(q.t)}</text>`; break;
      }
    });
    out+=g+'</g>';
  });
  const wmm=(W+2*m)*10, hmm=(D+2*m)*10; // 1:100
  const attrs = opts.export ? ` width="${wmm}mm" height="${hmm}mm"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${attrs}>${opts.export?`<desc>${esc(S.pname)} — tek kat şematik plan, ölçek 1:100, birim metre. Katman id'leri AutoCAD katman adlarıdır.</desc>`:''}${out}</svg>`;
}

      case 'line': ln(q.l,q.x1,q.y1,q.x2,q.y2); break;
      case 'circle': push('0','CIRCLE','8',q.l,'10',f(q.cx),'20',f(q.cy),'30','0','40',f(q.r)); break;
      case 'arc': push('0','ARC','8',q.l,'10',f(q.cx),'20',f(q.cy),'30','0','40',f(q.r),'50',f(q.a0),'51',f(q.a1)); break;
      case 'text': { const w=q.t.length*q.s*0.55; const x=q.anchor==='middle'?(q.rot?q.x:q.x-w/2):q.x;
        push('0','TEXT','8',q.l,'10',f(x),'20',f(q.rot?q.y-w/2:q.y),'30','0','40',f(q.s),'1',q.t,'50',f(q.rot||0)); break; }
    }
  });
  push('0','ENDSEC','0','EOF');
  return o.join('\r\n');
}

/* ---------- PDF (jsPDF, A3 yatay, 1:100, renk kodlu) ---------- */
function toPDF(model){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a3'});
  const {P,D,W}=model; const sc=10; // 1 m = 10 mm
  const pw=420, ph=297; const drawW=(W+4)*sc, drawH=(D+4)*sc;
  const ox=(pw-70-drawW)/2+20, oy=(ph-drawH)/2+ (D+2)*sc; // sol-alt orijin
  const X=x=>ox+x*sc, Y=y=>oy-y*sc;
  const tr=t=>String(t).replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ı/g,'i').replace(/İ/g,'I');
  const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  doc.setLineCap('square');
  LAYERS.forEach(Ld=>{
    const col=hex(Ld.color); doc.setDrawColor(...col); doc.setFillColor(...col); doc.setTextColor(...col); doc.setLineWidth(Ld.lw);
    P.filter(q=>q.l===Ld.id).forEach(q=>{
      switch(q.k){
        case 'rect': if(q.fill) doc.rect(X(q.x),Y(q.y+q.h),q.w*sc,q.h*sc,'F');
          else if(q.fillColor){ doc.setFillColor(...hex(q.fillColor)); doc.rect(X(q.x),Y(q.y+q.h),q.w*sc,q.h*sc,'F'); doc.setFillColor(...col); }
          else if(q.white){ doc.setFillColor(255,255,255); doc.rect(X(q.x),Y(q.y+q.h),q.w*sc,q.h*sc,'FD'); doc.setFillColor(...col); }
          else doc.rect(X(q.x),Y(q.y+q.h),q.w*sc,q.h*sc,'S'); break;
        case 'line': if(q.dash) doc.setLineDashPattern([1.5,1],0); doc.line(X(q.x1),Y(q.y1),X(q.x2),Y(q.y2)); if(q.dash) doc.setLineDashPattern([],0); break;
        case 'circle': if(q.white){ doc.setFillColor(255,255,255); doc.circle(X(q.cx),Y(q.cy),q.r*sc,'FD'); doc.setFillColor(...col); } else doc.circle(X(q.cx),Y(q.cy),q.r*sc,'S'); break;
        case 'arc': { let a0=q.a0,a1=q.a1; if(a1<a0) a1+=360; const n=12; let px,py;
          for(let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; const x=X(q.cx+q.r*Math.cos(a)), y=Y(q.cy+q.r*Math.sin(a)); if(i) doc.line(px,py,x,y); px=x;py=y; } break; }
        case 'text': doc.setFont('helvetica','normal'); doc.setFontSize(q.s*sc*2.835);
          doc.text(tr(q.t),X(q.x),Y(q.y),{align:q.anchor==='middle'?'center':'left',angle:q.rot||0}); break;
      }
    });
  });
  // antet + katman lejantı
  const bx=pw-75, by=ph-10; doc.setDrawColor(27,27,27); doc.setLineWidth(0.3); doc.rect(bx,by-92,65,92,'S');
  doc.setTextColor(27,27,27); doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.text(tr(S.pname),bx+4,by-84);
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Tek kat sematik plan',bx+4,by-78); doc.text('Olcek 1:100 · A3 · birim m',bx+4,by-73);
  doc.text(new Date().toISOString().slice(0,10),bx+4,by-68);
  const net=model.L.rooms.reduce((s,r)=>s+r.area,0);
  doc.text(`Brut ${r2(W*D)} m²  ·  Net ${r2(net)} m²`,bx+4,by-63);
  doc.setFontSize(7.5); doc.text('KATMANLAR (AutoCAD adı · ACI renk)',bx+4,by-55);
  LAYERS.forEach((l,i)=>{ const yy=by-49+i*5.5; doc.setFillColor(...hex(l.color)); doc.rect(bx+4,yy-2.5,6,3,'F'); doc.setTextColor(27,27,27); doc.text(tr(`${l.id}  ·  ${l.name}  ·  ${l.aci}`),bx+12,yy); });
  return doc.output('blob');
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function readState(){
  S.beds=clamp(Math.round(+$('beds').value||1),1,4);
  S.W=clamp(+$('W').value||10,8,13);
  S.te=clamp(+$('te').value||0.25,0.15,0.5); S.ti=clamp(+$('ti').value||0.1,0.08,0.25);
  S.furn=$('furn').checked; S.fills=$('fills').checked; S.dims=$('dims').checked; S.pname=$('pname').value||'Konut';
}
let MODEL=null;
function render(){
  readState(); MODEL=build(S);
  $('sheet').innerHTML=toSVG(MODEL,{export:false});
  $('warn').innerHTML=MODEL.L.warnings.map(w=>`<div>⚠ ${w}</div>`).join('');
  const rows=MODEL.L.rooms.filter(r=>r.name);
  let net=0; const tr=rows.map(r=>{ const a=r.area; net+=a; return `<tr><td><span class="sw" style="background:${ZONE_FILL[r.zone]}"></span>${r.name}</td><td>${r2(r.w)}×${r2(r.h)}</td><td>${a.toFixed(2)} m²</td></tr>`; }).join('');
  $('prog').innerHTML=tr+`<tr class="total"><td>Net toplam</td><td></td><td>${net.toFixed(2)} m²</td></tr><tr class="total"><td>Brüt (dış yüz)</td><td>${r2(S.W)}×${r2(MODEL.D)}</td><td>${r2(S.W*MODEL.D).toFixed(2)} m²</td></tr>`;
  $('status').textContent=`${S.W.toFixed(2)} × ${MODEL.D.toFixed(2)} m · ${S.beds}+1 · koridor ${MODEL.L.Lc.toFixed(2)} m · dışa aktarım 1:100`;
}
function buildLegend(){
  $('legend').innerHTML='<span>Katmanlar:</span>'+LAYERS.map(l=>`<label><input type="checkbox" data-l="${l.id}" checked><span class="sw" style="background:${l.color}"></span>${l.name} <code>${l.id}</code></label>`).join('');
  $('legend').querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{ if(i.checked) S.hidden.delete(i.dataset.l); else S.hidden.add(i.dataset.l); render(); }));
}
document.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S[seg.id]=b.dataset.v; render();
})));
document.querySelectorAll('aside input,aside select').forEach(i=>{i.addEventListener('input',render);i.addEventListener('change',render);});

/* ---------- İndirme ---------- */
let DL=null;
async function save(filename,data){
  if(!DL){ $('status').textContent='İndirme bu görünümde kullanılamıyor.'; return; }
  try{ await DL.save({filename,data}); $('status').textContent=`Kaydedildi: ${filename}`; }
  catch(e){ $('status').textContent = e&&e.code==='declined' ? 'İndirme iptal edildi.' : `İndirme başarısız: ${e&&e.message||e}`; }
}
const fname=ext=>`${S.pname.replace(/[^\w\-]+/g,'_')}_plan_${S.beds}+1.${ext}`;
$('btnSvg').onclick=()=>save(fname('svg'),toSVG(MODEL,{export:true}));
$('btnDxf').onclick=()=>save(fname('dxf.txt'),toDXF(MODEL));
$('btnPdf').onclick=()=>{ if(!window.jspdf){ $('status').textContent='PDF kütüphanesi yüklenemedi.'; return; } save(fname('pdf'),toPDF(MODEL)); };

buildLegend(); render();
if(window.claude&&window.claude.use){ claude.use('downloads').then(d=>{ DL=d; if(!d){ ['btnSvg','btnDxf','btnPdf'].forEach(id=>$(id).disabled=true); $('status').textContent+=' · indirme bu görünümde kapalı'; } }); }
else { ['btnSvg','btnDxf','btnPdf'].forEach(id=>$(id).disabled=true); }
</script>
