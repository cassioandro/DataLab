<title>Tek Kat Plan Stüdyosu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e7eae6; --panel:#fbfbf9; --ink:#172120; --muted:#5f6c68; --line:#cdd4d0; --line-2:#e2e7e3;
  --accent:#24507a; --accent-ink:#ffffff; --warn:#a85f0a; --warn-bg:#fbf1e0; --ok:#2b7a4b;
  --sheet:#ffffff; --sheet-edge:#b9c2bd;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151b19; --panel:#1e2624; --ink:#e6ebe8; --muted:#97a39e; --line:#33403b; --line-2:#28322e;
    --accent:#8ab8e6; --accent-ink:#0e1a25; --warn:#e0a24a; --warn-bg:#2d2416; --ok:#6cc28f;
    --sheet:#ffffff; --sheet-edge:#3b4743;
  }
}
:root[data-theme="dark"]{
  --bg:#151b19; --panel:#1e2624; --ink:#e6ebe8; --muted:#97a39e; --line:#33403b; --line-2:#28322e;
  --accent:#8ab8e6; --accent-ink:#0e1a25; --warn:#e0a24a; --warn-bg:#2d2416; --ok:#6cc28f;
  --sheet:#ffffff; --sheet-edge:#3b4743;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100vh}
.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:600 20px/1 var(--f-display);margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:12.5px}
header .spacer{flex:1}
.btn{font:500 13px var(--f-body);padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
aside{border-right:1px solid var(--line);background:var(--panel);padding:16px 18px 28px;overflow-y:auto}
aside h2{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
aside h2:first-child{margin-top:0}
.field{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2)}
.field label{font-size:13px}
.field small{display:block;color:var(--muted);font-size:11.5px}
.field input[type=number],.field select{width:100%;font:500 13px var(--f-mono);padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.field input[type=checkbox]{justify-self:end;width:16px;height:16px;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;font:500 12px var(--f-body);padding:5px 0;border:0;background:var(--bg);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.warn{background:var(--warn-bg);color:var(--warn);border-left:3px solid var(--warn);padding:8px 10px;font-size:12.5px;margin:10px 0;border-radius:0 3px 3px 0}
.warn:empty{display:none}
table.prog{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.prog td{padding:3px 0;border-bottom:1px solid var(--line-2)}
table.prog td:last-child{text-align:right;font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
table.prog tr.total td{border-top:1px solid var(--line);border-bottom:0;font-weight:500}
table.prog td .sw{display:inline-block;width:9px;height:9px;border:1px solid var(--sheet-edge);margin-right:6px;vertical-align:-1px}
main{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--sheet-edge);box-shadow:0 1px 0 var(--sheet-edge);height:calc(100vh - 150px);min-height:420px;position:relative}
.sheet svg{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted)}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.legend .sw{width:14px;height:3px;border-radius:1px}
.legend code{font:11.5px var(--f-mono);color:var(--muted)}
.legend input{accent-color:var(--accent)}
.status{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>

<div class="app">
<header>
  <div><h1>Tek Kat Plan Stüdyosu</h1><div class="sub">Parametrik program → şematik plan → katmanlı SVG / renk kodlu PDF / DXF</div></div>
  <div class="spacer"></div>
  <button class="btn" id="btnSvg">SVG indir</button>
  <button class="btn" id="btnDxf">DXF indir</button>
  <button class="btn primary" id="btnPdf">PDF indir (A3, 1:100)</button>
</header>

<aside>
  <h2>Program</h2>
  <div class="field"><label>Yatak odası sayısı<small>Ebeveyn dahil</small></label><input type="number" id="beds" min="1" max="4" value="3"></div>
  <div class="field"><label>Banyo sayısı<small>2 = ebeveyn en-suite</small></label><input type="number" id="baths" min="1" max="2" value="2"></div>
  <div class="field"><label>Ayrı WC<small>Giriş holünden</small></label><input type="checkbox" id="wc" checked></div>
  <div class="field"><label>Mutfak</label><div class="seg" id="kitchen"><button data-v="closed" class="on">Kapalı</button><button data-v="open">Açık</button></div></div>
  <div class="field"><label>Yemek masası</label><div class="seg" id="dining"><button data-v="living" class="on">Salonda</button><button data-v="kitchen">Mutfakta</button></div></div>
  <div class="field"><label>Giriş<small>Dar (güney) kenarda</small></label><div class="seg" id="side"><button data-v="left" class="on">Sol</button><button data-v="right">Sağ</button></div></div>
  <div class="field"><label>Giriş nişi<small>1.2 m geri çekilmiş sundurma</small></label><input type="checkbox" id="porch" checked></div>

  <h2>Kabuk (m)</h2>
  <div class="field"><label>Bina genişliği<small>Dar kenar, dış yüz</small></label><input type="number" id="W" min="8" max="13" step="0.1" value="10.0"></div>
  <div class="field"><label>Giriş / mutfak bandı</label><input type="number" id="Dk" min="3.0" max="4.5" step="0.1" value="3.6"></div>
  <div class="field"><label>Salon derinliği</label><input type="number" id="Dl" min="4.0" max="7.5" step="0.1" value="5.5"></div>
  <div class="field"><label>Yatak odası derinliği<small>Koridor boyunca</small></label><input type="number" id="Db" min="3.0" max="4.5" step="0.1" value="3.6"></div>
  <div class="field"><label>Ebeveyn derinliği</label><input type="number" id="Dm" min="3.6" max="5.5" step="0.1" value="4.2"></div>
  <div class="field"><label>Koridor genişliği</label><input type="number" id="c" min="1.0" max="2.0" step="0.05" value="1.3"></div>
  <div class="field"><label>Dış duvar kalınlığı</label><input type="number" id="te" min="0.15" max="0.5" step="0.05" value="0.25"></div>
  <div class="field"><label>İç duvar kalınlığı</label><input type="number" id="ti" min="0.08" max="0.25" step="0.01" value="0.10"></div>

  <h2>Çizim</h2>
  <div class="field"><label>Tefriş</label><input type="checkbox" id="furn" checked></div>
  <div class="field"><label>Oda dolguları</label><input type="checkbox" id="fills" checked></div>
  <div class="field"><label>Ölçü çizgileri</label><input type="checkbox" id="dims" checked></div>
  <div class="field"><label>Proje adı</label><input type="text" id="pname" value="Konut A" style="font:500 13px var(--f-mono);padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);width:100%"></div>

  <div class="warn" id="warn"></div>

  <h2>Mahal listesi</h2>
  <table class="prog" id="prog"></table>
</aside>

<main>
  <div class="sheet" id="sheet"></div>
  <div class="legend" id="legend"></div>
  <div class="status" id="status"></div>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- Katmanlar (AutoCAD ACI renk indeksleriyle eşleşir) ---------- */
const LAYERS = [
  {id:'A-AREA',     name:'Mahal dolgu', color:'#9aa4a0', aci:9, lw:0.09},
  {id:'A-WALL-EXT', name:'Dış duvar',   color:'#1b1b1b', aci:7, lw:0.35},
  {id:'A-WALL-INT', name:'İç duvar',    color:'#4a4a4a', aci:8, lw:0.25},
  {id:'A-DOOR',     name:'Kapı',        color:'#d11a1a', aci:1, lw:0.18},
  {id:'A-GLAZ',     name:'Pencere',     color:'#0a9cb3', aci:4, lw:0.18},
  {id:'A-FURN',     name:'Tefriş',      color:'#1e8f3c', aci:3, lw:0.13},
  {id:'A-ANNO',     name:'Mahal yazısı',color:'#1a3fbf', aci:5, lw:0.13},
  {id:'A-DIMS',     name:'Ölçü',        color:'#b81aa8', aci:6, lw:0.13},
];
const LAYER = Object.fromEntries(LAYERS.map(l=>[l.id,l]));
const ZONE_FILL = {day:'#f6ecd8', night:'#dfe8f4', wet:'#d9efe9', circ:'#efefe8'};

/* ---------- Durum ---------- */
const S = {beds:3, baths:2, wc:true, kitchen:'closed', dining:'living', side:'left', porch:true,
  W:10.0, Dk:3.6, Dl:5.5, Db:3.6, Dm:4.2, c:1.3, te:0.25, ti:0.10,
  furn:true, fills:true, dims:true, pname:'Konut A', hidden:new Set()};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*100)/100;

/* ---------- Yerleşim algoritması ----------
   Şema (kuzey yukarı, giriş güney dar kenarda, batı köşede; "sağ" seçilirse tüm plan aynalanır):
     ┌────────────────────┐
     │  EBEVEYN (+giyinme)│  koridor ucu ebeveyne açılır
     ├──────┬─┬───────────┤
     │ Y.O. │k│ Y.O.      │  koridor iki yanı yatak odaları / banyo / en-suite
     │ Banyo│o│ En-suite  │
     ├──────┴─┴───────────┤
     │       SALON        │  tam genişlik
     ├──────┬─────────────┤
     │GİRİŞ │   MUTFAK    │
     │ +WC  │             │
     └──────┴─────────────┘
   Tüm ölçüler metre, orijin bina sol-alt dış köşe (mutfak güney duvarı hizası). */
function layout(p){
  const {W,te,ti,c}=p; const pd=p.porch?1.2:0;
  const x0=te, x1=W-te;
  const wE=2.8, wcW=1.4, wcD=1.7;
  const xh1=x0+wE, xk0=xh1+ti;
  const yH0=pd+te, yK1=te+p.Dk;
  const yL0=yK1+ti, yL1=yL0+p.Dl;
  const yN0=yL1+ti;
  const xc0=r2((W-c)/2), xc1=xc0+c;
  const xw0=x0, xw1=xc0-ti, xe0=xc1+ti, xe1=x1;
  const wSide=xw1-xw0;
  const rooms=[], warnings=[];

  const hall={id:'ENT',name:'Giriş Holü',zone:'circ',x:x0,y:yH0,w:wE,h:yK1-yH0};
  const kitchen={id:'KIT',name:p.kitchen==='open'?'Mutfak (açık)':'Mutfak',zone:'day',x:xk0,y:te,w:x1-xk0,h:p.Dk};
  const living={id:'LIV',name:'Salon',zone:'day',x:x0,y:yL0,w:x1-x0,h:p.Dl,labelY:yL0+p.Dl/2+0.3};
  rooms.push(hall,kitchen,living);
  if(p.wc) rooms.push({id:'WC',name:'WC',zone:'wet',x:x0,y:yL0,w:wcW,h:wcD}); // salonun GB köşesinde, kapısı holden

  /* --- koridor iki yanı: yığınlar --- */
  const st={W:{rooms:[],len:0,x:xw0,w:wSide},E:{rooms:[],len:0,x:xe0,w:xe1-xe0}};
  const put=(side,it)=>{ const s=st[side]; it.side=side; it.x=s.x; it.w=s.w; it.y=yN0+s.len+(s.rooms.length?ti:0); s.len=(it.y-yN0)+it.d; s.rooms.push(it); };
  const shorter=()=>st.W.len<=st.E.len?'W':'E';
  put('W',{id:'BTH',name:'Banyo',zone:'wet',kind:'bath',d:2.4});
  for(let i=2;i<=p.beds;i++) put(shorter(),{id:'BR'+i,name:'Yatak Odası '+i,zone:'night',kind:'bed',d:p.Db});
  if(p.baths===2) put(shorter(),{id:'ENS',name:'Eb. Banyo',zone:'wet',kind:'ensuite',d:2.4});
  let diff=Math.abs(st.W.len-st.E.len);
  if(diff>0.01){
    const sh=shorter(), s=st[sh]; const last=s.rooms[s.rooms.length-1];
    const dd=diff-(s.rooms.length?ti:0);
    if(diff<1.0 && last){ last.d+=diff; s.len+=diff; }
    else if(last&&last.kind==='ensuite'){ // en-suite ebeveyne bitişik kalmalı: önüne araya oda sok
      s.rooms.pop(); s.len=last.y-yN0-ti;
      put(sh, dd>=1.5?{id:'STD',name:'Çalışma Odası',zone:'night',kind:'study',d:dd}:{id:'STO',name:'Depo',zone:'circ',kind:'store',d:dd});
      put(sh,last);
    }
    else if(diff<2.0) put(sh,{id:'DRS',name:'Giyinme',zone:'night',kind:'dress',d:dd});
    else put(sh,{id:'STD',name:'Çalışma Odası',zone:'night',kind:'study',d:dd});
  }
  const Lc=Math.max(st.W.len,st.E.len);
  const yM0=yN0+Lc+ti, yM1=yM0+p.Dm, D=yM1+te;
  const corridor={id:'COR',name:'Koridor',zone:'circ',x:xc0,y:yN0,w:c,h:Lc};
  const master={id:'BR1',name:p.beds===1?'Yatak Odası':'Ebeveyn Y.O.',zone:'night',kind:'master',x:x0,y:yM0,w:x1-x0,h:p.Dm};
  rooms.push(corridor,...st.W.rooms,...st.E.rooms,master);
  rooms.forEach(r=>{ if(r.d!=null) r.h=r.d; r.area=r2(r.w*r.h); });
  if(p.wc) living.area=r2(living.area-(wcW+ti)*(wcD+ti));

  if(wSide<3.0) warnings.push(`Yan yatak odaları çok dar (${r2(wSide)} m). Bina genişliğini artırın.`);
  if(wSide>4.6) warnings.push(`Yan odalar gereksiz geniş (${r2(wSide)} m). Bina genişliğini azaltın.`);
  if(kitchen.w<2.8) warnings.push(`Mutfak çok dar (${r2(kitchen.w)} m).`);
  if(p.dining==='kitchen'&&(kitchen.w<4.6||kitchen.h<3.4)) warnings.push('Mutfak yemek masası için küçük; masa salona alındı.');
  if(D/W>2.6) warnings.push(`Plan çok uzun (${r2(D)} m). Genişliği artırmak koridoru kısaltır.`);
  return {rooms,warnings,D,W,pd,x0,x1,wE,xh1,xk0,yH0,yK1,yL0,yL1,yN0,xc0,xc1,xw0,xw1,xe0,xe1,Lc,yM0,yM1,wcW,wcD,st,hall,kitchen,living,master,corridor};
}

/* ---------- Geometri → ilkeller (metre, y yukarı) ---------- */
function build(p){
  const L=layout(p); const {W,te,ti,c}=p; const {D,pd}=L;
  const P=[];
  const rect=(l,x,y,w,h,fill,extra)=>P.push(Object.assign({k:'rect',l,x,y,w,h,fill:!!fill},extra||{}));
  const line=(l,x1,y1,x2,y2)=>P.push({k:'line',l,x1,y1,x2,y2});
  const arc=(l,cx,cy,r,a0,a1)=>P.push({k:'arc',l,cx,cy,r,a0,a1});
  const circle=(l,cx,cy,r)=>P.push({k:'circle',l,cx,cy,r});
  const text=(l,x,y,s,t,anchor,rot)=>P.push({k:'text',l,x,y,s,t,anchor:anchor||'middle',rot:rot||0});

  /* duvarlar: dir 'h' → (x,y) sol-alt, len boyunca +x; 'v' → len boyunca +y. openings: [{at,w,kind,swing,hinge}] */
  const walls=[];
  const wall=(l,dir,x,y,len,t,openings)=>{ const w={l,dir,x,y,len,t,op:openings||[]}; walls.push(w); return w; };
  function emitWalls(){
    walls.forEach(w=>{
      const ops=[...w.op].sort((a,b)=>a.at-b.at); let cur=0;
      const seg=(a,b)=>{ if(b-a<=0.001) return; if(w.dir==='h') rect(w.l,w.x+a,w.y,b-a,w.t,true); else rect(w.l,w.x,w.y+a,w.t,b-a,true); };
      ops.forEach(o=>{ seg(cur,o.at); cur=o.at+o.w; }); seg(cur,w.len);
      ops.forEach(o=>{
        const ax=w.dir==='h'?w.x+o.at:w.x, ay=w.dir==='h'?w.y:w.y+o.at;
        const jamb=()=>{ if(w.dir==='h'){ line('A-DOOR',ax,w.y,ax,w.y+w.t); line('A-DOOR',ax+o.w,w.y,ax+o.w,w.y+w.t); } else { line('A-DOOR',w.x,ay,w.x+w.t,ay); line('A-DOOR',w.x,ay+o.w,w.x+w.t,ay+o.w); } };
        if(o.kind==='window'){
          if(w.dir==='h'){ [0,0.4,0.6,1].forEach(f=>line('A-GLAZ',ax,ay+w.t*f,ax+o.w,ay+w.t*f)); }
          else { [0,0.4,0.6,1].forEach(f=>line('A-GLAZ',ax+w.t*f,ay,ax+w.t*f,ay+o.w)); }
        } else if(o.kind==='door'){
          const s=o.swing, face=s>0?(w.dir==='h'?w.y+w.t:w.x+w.t):(w.dir==='h'?w.y:w.x);
          let hx,hy,ux,uy,nx,ny;
          if(w.dir==='h'){ hy=face; ny=s; nx=0; uy=0; if(o.hinge==='b'){hx=ax+o.w; ux=-1;} else {hx=ax; ux=1;} }
          else { hx=face; nx=s; ny=0; ux=0; if(o.hinge==='b'){hy=ay+o.w; uy=-1;} else {hy=ay; uy=1;} }
          line('A-DOOR',hx,hy,hx+nx*o.w,hy+ny*o.w); jamb();
          const aN=Math.atan2(ny,nx)*180/Math.PI, aU=Math.atan2(uy,ux)*180/Math.PI;
          let a0=aN,a1=aU; const d=((a1-a0)%360+360)%360; if(d>180){ [a0,a1]=[a1,a0]; }
          arc('A-DOOR',hx,hy,o.w,a0,a1);
        } else if(o.kind==='open') jamb();
      });
    });
  }

  const {x0,x1,wE,xh1,xk0,yH0,yK1,yL0,yL1,yN0,xc0,xc1,xw0,xw1,xe0,xe1,Lc,yM0,yM1,wcW,wcD,st,hall,kitchen,living,master}=L;

  /* --- dış duvarlar (giriş nişi varsa güney cephe iki parça) --- */
  let southK, southH;
  if(pd>0){
    rect('A-WALL-EXT',xk0-te,0,te,pd+te,true);            // niş yan duvarı
    southK=wall('A-WALL-EXT','h',xk0,0,W-xk0,te);
    southH=wall('A-WALL-EXT','h',0,pd,xk0-te,te);
  } else { southK=wall('A-WALL-EXT','h',0,0,W,te); southH=southK; }
  const west=wall('A-WALL-EXT','v',0,pd,D-pd,te);
  const east=wall('A-WALL-EXT','v',W-te,0,D,te);
  const north=wall('A-WALL-EXT','h',0,D-te,W,te);
  const ctr=(a,len,ww)=>a+(len-ww)/2;
  // giriş kapısı + hol yan penceresi
  southH.op.push({at:(x0+0.6)-southH.x,w:1.0,kind:'door',swing:+1,hinge:'a'});
  west.op.push({at:(yH0+1.3)-pd,w:0.9,kind:'window'});
  // mutfak: güney + doğu pencere
  southK.op.push({at:ctr(kitchen.x,kitchen.w,Math.min(1.8,kitchen.w-1.2))-southK.x,w:Math.min(1.8,kitchen.w-1.2),kind:'window'});
  east.op.push({at:ctr(kitchen.y,kitchen.h,1.2),w:1.2,kind:'window'});
  // salon: batı + doğu pencere
  const lw=Math.min(2.4,living.h-1.4);
  { const ly=p.wc?living.y+wcD+ti:living.y, lh=p.wc?living.h-wcD-ti:living.h; const lww=Math.min(lw,lh-1.0); west.op.push({at:ctr(ly,lh,lww)-pd,w:lww,kind:'window'}); }
  east.op.push({at:ctr(living.y,living.h,lw),w:lw,kind:'window'});
  // yan odalar: dış duvar pencereleri
  const winFor=k=>k==='bath'||k==='ensuite'?0.6:k==='dress'||k==='store'?0:1.6;
  st.W.rooms.forEach(r=>{ const ww=Math.min(winFor(r.kind),r.d-0.8); if(ww>0) west.op.push({at:ctr(r.y,r.d,ww)-pd,w:ww,kind:'window'}); });
  st.E.rooms.forEach(r=>{ const ww=Math.min(winFor(r.kind),r.d-0.8); if(ww>0) east.op.push({at:ctr(r.y,r.d,ww),w:ww,kind:'window'}); });
  // ebeveyn: kuzey + doğu pencere (yatak başı batı duvarında)
  north.op.push({at:ctr(master.x,master.w,2.4),w:2.4,kind:'window'});
  east.op.push({at:ctr(master.y,master.h,1.2),w:1.2,kind:'window'});

  /* --- iç duvarlar --- */
  // hol | mutfak (mutfak kapısı holden)
  wall('A-WALL-INT','v',xh1,yH0,yK1-yH0,ti,[{at:0.7,w:0.9,kind:'door',swing:+1,hinge:'a'}]);
  // mutfak | salon
  if(p.kitchen==='closed') wall('A-WALL-INT','h',xk0,yK1,x1-xk0,ti,[{at:0.3,w:0.9,kind:'door',swing:-1,hinge:'a'}]);
  else line('A-FURN',xk0,yK1+ti/2,x1,yK1+ti/2);
  // hol | salon: geniş açıklık
  const passAt=p.wc?wcW+ti:0.6, passW=p.wc?wE-wcW-ti-0.1:wE-1.2;
  const hallN=wall('A-WALL-INT','h',x0,yK1,wE,ti,[{at:passAt,w:passW,kind:'open'}]);
  // WC: salon köşesinde, kapısı holden (güney duvarı = hol/salon duvarı)
  if(p.wc){
    hallN.op.push({at:0.35,w:0.7,kind:'door',swing:-1,hinge:'b'});
    wall('A-WALL-INT','h',x0,yL0+wcD,wcW+ti,ti);
    wall('A-WALL-INT','v',x0+wcW,yL0,wcD+ti,ti);
  }
  // salon | gece zonu: koridor ağzı açık
  wall('A-WALL-INT','h',x0,yL1,x1-x0,ti,[{at:xc0-x0,w:c,kind:'open'}]);
  // koridor duvarları
  const corW=wall('A-WALL-INT','v',xw1,yN0,Lc,ti), corE=wall('A-WALL-INT','v',xc1,yN0,Lc,ti);
  // ebeveyn güney duvarı: koridor ucu kapısı
  const mS=wall('A-WALL-INT','h',x0,yM0-ti,x1-x0,ti,[{at:(xc0+(c-0.9)/2)-x0,w:0.9,kind:'door',swing:+1,hinge:'a'}]);
  // yığın odaları: ara duvarlar + kapılar
  [['W',st.W,corW,-1],['E',st.E,corE,+1]].forEach(([side,s,cw,sw])=>{
    s.rooms.forEach((r,i)=>{
      if(i<s.rooms.length-1) wall('A-WALL-INT','h',r.x,r.y+r.d,r.w,ti);
      const fromMaster=(r.kind==='ensuite'||r.kind==='dress')&&i===s.rooms.length-1;
      if(fromMaster){ // kapı kuzey duvarından (ebeveynden), koridor tarafına yakın
        const dw=0.8, at = side==='W' ? (r.x+r.w-0.25-dw)-x0 : (r.x+0.25)-x0;
        mS.op.push({at,w:dw,kind:'door',swing:-1,hinge:side==='W'?'b':'a'});
      } else {
        const dw=r.kind==='bath'?0.8:0.9;
        cw.op.push({at:(r.y-yN0)+r.d-0.15-dw,w:dw,kind:'door',swing:sw,hinge:'b'});
      }
      r.fromMaster=fromMaster;
    });
  });
  emitWalls();

  /* --- mahal dolguları & yazılar --- */
  L.rooms.forEach(r=>{
    if(p.fills){
      rect('A-AREA',r.x,r.y,r.w,r.h,false,{fillColor:ZONE_FILL[r.zone]});
    }
    const cxm=r.x+r.w/2, cym=r.labelY!=null?r.labelY:r.y+r.h/2;
    if(r.id==='COR'){ text('A-ANNO',cxm,cym,0.2,`Koridor ${r.area} m²`,'middle',90); return; }
    const small=r.w<2.0||r.h<2.0;
    if(r.kind==='dress'||r.kind==='store'){ text('A-ANNO',cxm,cym-0.07,0.18,`${r.name} ${r.area} m²`); return; }
    text('A-ANNO',cxm,cym+(small?0.05:0.18),small?0.2:0.26,r.name);
    if(!small){ text('A-ANNO',cxm,cym-0.12,0.18,`${r2(r.w)} × ${r2(r.h)}`); text('A-ANNO',cxm,cym-0.38,0.2,`${r.area} m²`); }
    else text('A-ANNO',cxm,cym-0.22,0.16,`${r.area} m²`);
  });

  /* --- tefriş: oda yerel çerçevesi (kapı duvarı x=lw'de, yatak başı duvarı y=0'da) --- */
  if(p.furn){
    const F='A-FURN';
    function frame(r,code){
      let lw,lh,map;
      if(code==='E'){ lw=r.w; lh=r.d; map=(x,y)=>[r.x+x,r.y+y]; }               // kapı doğu duvarında (batı yığını)
      else if(code==='W'){ lw=r.w; lh=r.d; map=(x,y)=>[r.x+r.w-x,r.y+y]; }      // kapı batı duvarında (doğu yığını)
      else if(code==='S'){ lw=r.h; lh=r.w; map=(x,y)=>[r.x+y,r.y+r.h-x]; }      // kapı güney duvarında (ebeveyn)
      else if(code==='Nw'){ lw=r.d; lh=r.w; map=(x,y)=>[r.x+y,r.y+x]; }         // kapı kuzeyde, koridor tarafı doğu
      else { lw=r.d; lh=r.w; map=(x,y)=>[r.x+r.w-y,r.y+x]; }                     // 'Ne': kapı kuzeyde, koridor tarafı batı
      const box=(x,y,w,h)=>{ const [a,b]=map(x,y),[c2,d2]=map(x+w,y+h); rect(F,Math.min(a,c2),Math.min(b,d2),Math.abs(c2-a),Math.abs(d2-b),false); };
      const ln=(x1,y1,x2,y2)=>{ const [a,b]=map(x1,y1),[c2,d2]=map(x2,y2); line(F,a,b,c2,d2); };
      const circ=(x,y,rr)=>{ const [a,b]=map(x,y); circle(F,a,b,rr); };
      return {lw,lh,box,ln,circ};
    }
    const wcSym=(f,cx,cy)=>{ f.box(cx-0.2,cy,0.4,0.2); f.circ(cx,cy+0.45,0.19); };       // hazne y=cy'de duvara dayalı
    const basin=(f,cx,cy)=>{ f.box(cx-0.25,cy-0.2,0.5,0.4); f.circ(cx,cy,0.14); };
    function bedroom(f,doorY,master){
      const {lw,lh,box,ln}=f;
      const dbl=lw>=3.0; const bw=dbl?1.6:1.0;
      box(0.6,0.05,bw,2.0); ln(0.6,0.5,0.6+bw,0.5); if(dbl) ln(0.6+bw/2,0.5,0.6+bw/2,2.05);   // yatak, başı y=0 duvarında
      box(0.05,0.05,0.5,0.5); if(0.6+bw+0.55<lw-0.65) box(0.65+bw,0.05,0.5,0.5);           // komodinler
      const wl=doorY-0.15; if(wl>=0.9){ box(lw-0.6,0,0.6,wl); ln(lw-0.6,0,lw,wl); ln(lw-0.6,wl,lw,0); }  // gardırop: kapı duvarı, kapının gerisinde
      if(master){ const y2=doorY+0.9+0.15; if(lh-y2>=1.0){ box(lw-0.6,y2,0.6,lh-y2); ln(lw-0.6,y2,lw,lh); ln(lw-0.6,lh,lw,y2); } box(0.3,lh-0.55,1.2,0.5); } // ebeveyn: ikinci gardırop + şifonyer
    }
    function bath(f,full){
      const {lw,lh,box,ln}=f;
      if(lw>=2.6&&full){ box(0.05,0.05,1.7,0.75); box(0.2,0.18,1.4,0.5); } else { box(0.05,0.05,0.9,0.9); ln(0.05,0.05,0.95,0.95); }
      wcSym(f,lw-0.5,0.08); basin(f,0.45,lh-0.4);
      if(full&&lh>=2.6) box(lw-0.65,0.9,0.6,0.6);
    }
    L.rooms.forEach(r=>{
      if(r.side){ // yığın odaları
        const code = r.fromMaster ? (r.side==='W'?'Nw':'Ne') : (r.side==='W'?'E':'W');
        const f=frame(r,code);
        if(r.kind==='bed') bedroom(f,f.lh-0.15-0.9,false);
        else if(r.kind==='bath') bath(f,true);
        else if(r.kind==='ensuite') bath(f,false);
        else if(r.kind==='dress'){ f.box(0,0.05,0.6,f.lh-0.1); f.ln(0,0.05,0.6,f.lh-0.05); if(f.lw>=1.8){ f.box(f.lw-0.6,0.05,0.6,f.lh-1.2); } }
        else if(r.kind==='study'){ f.box(0.05,f.lh/2-0.7,0.7,1.4); f.box(0.85,f.lh/2-0.25,0.5,0.5); f.box(0.9,0,f.lw-1.5,0.35); }
        else if(r.kind==='store'){ f.box(0,0.05,0.5,f.lh-0.1); }
      }
    });
    // ebeveyn: kapı güney duvarında koridor hizasında; yatak başı batı duvarında
    { const f=frame(master,'S'); bedroom(f,(xc0+(c-0.9)/2)-master.x,true); }
    // WC
    if(p.wc){ const r=L.rooms.find(q=>q.id==='WC'); const f=frame(r,'E'); wcSym(f,0.35,r.h-0.7); basin(f,r.w-0.4,r.h-0.3); }
    // giriş holü: ayakkabılık (+ vestiyer, hol yeterince derinse)
    rect(F,hall.x+0.05,hall.y+0.15,0.35,1.0,false); if(hall.h>=3.2) rect(F,hall.x+wE-0.6,hall.y+hall.h-1.0,0.55,0.9,false);
    // mutfak: L tezgah güney+doğu, evye güney pencere altında, ocak doğu kanadında, buzdolabı kuzeydoğu
    { const k=kitchen; const t=0.6;
      rect(F,k.x,k.y,k.w,t,false); rect(F,k.x+k.w-t,k.y+t,t,k.h-t-0.8,false);
      rect(F,k.x+k.w-0.72,k.y+k.h-0.75,0.7,0.7,false); line(F,k.x+k.w-0.72,k.y+k.h-0.75,k.x+k.w-0.02,k.y+k.h-0.05);
      const sx=k.x+k.w/2; rect(F,sx-0.4,k.y+0.09,0.8,0.42,false); circle(F,sx-0.18,k.y+0.3,0.14); circle(F,sx+0.18,k.y+0.3,0.14);
      rect(F,k.x+k.w-0.52,k.y+1.2,0.42,0.6,false); [0.15,0.45].forEach(dy=>{circle(F,k.x+k.w-0.42,k.y+1.2+dy,0.07);circle(F,k.x+k.w-0.2,k.y+1.2+dy,0.07);});
      const dineK = p.dining==='kitchen' && k.w>=4.6 && k.h>=3.4;
      if(dineK){ const tx=k.x+1.1, ty=k.y+1.2; rect(F,tx,ty,1.6,0.9,false); [[tx+0.15,ty-0.5],[tx+1.0,ty-0.5],[tx+0.15,ty+0.95],[tx+1.0,ty+0.95],[tx-0.5,ty+0.22],[tx+1.65,ty+0.22]].forEach(([a,b])=>rect(F,a,b,0.45,0.45,false)); }
      L.dineInLiving=!dineK;
    }
    // salon: TV kuzey duvarı doğu bölümünde, kanepe karşısında; yemek grubu batı bölümünde
    { const l=living; const tvx=ctr(xe0,xe1-xe0,1.8), tvy=l.y+l.h-0.42;
      rect(F,tvx,tvy,1.8,0.4,false); line(F,tvx,tvy,tvx+1.8,tvy+0.4);
      const sx=tvx+0.9-1.1, sy=tvy-0.9-2.0; rect(F,sx,sy,2.2,0.9,false); rect(F,sx+0.15,sy+0.15,1.9,0.6,false);
      rect(F,sx+0.55,sy+1.1,1.1,0.6,false); rect(F,sx-1.0,sy+1.0,0.8,0.8,false);
      if(L.dineInLiving){ const tx=l.x+(p.wc?2.2:0.9), ty=l.y+1.0; rect(F,tx,ty,0.9,1.6,false); [[tx-0.5,ty+0.15],[tx-0.5,ty+1.0],[tx+0.95,ty+0.15],[tx+0.95,ty+1.0],[tx+0.22,ty-0.5],[tx+0.22,ty+1.65]].forEach(([a,b])=>rect(F,a,b,0.45,0.45,false)); }
    }
  }

  /* --- ölçü çizgileri --- */
  if(p.dims){
    const M='A-DIMS';
    const dimH=(xa,xb,y)=>{ line(M,xa,y,xb,y); [xa,xb].forEach(x=>line(M,x-0.07,y-0.07,x+0.07,y+0.07)); text(M,(xa+xb)/2,y+0.08,0.2,r2(xb-xa).toFixed(2)); };
    const dimV=(ya,yb,x,right)=>{ line(M,x,ya,x,yb); [ya,yb].forEach(y=>line(M,x-0.07,y-0.07,x+0.07,y+0.07)); text(M,right?x+0.08+0.2:x-0.08,(ya+yb)/2,0.2,r2(yb-ya).toFixed(2),'middle',90); };
    const ext=(x,ya,yb)=>line(M,x,ya,x,yb), extH=(y,xa,xb)=>line(M,xa,y,xb,y);
    const yd=-0.7, yt=-1.3;
    [[x0,xh1],[xk0,x1]].forEach(([a,b])=>{ dimH(a,b,yd); ext(a,-0.1,yd-0.15); ext(b,-0.1,yd-0.15); });
    dimH(0,W,yt); ext(0,-0.1,yt-0.15); ext(W,-0.1,yt-0.15);
    const yn=D+0.7; [[xw0,xw1],[xc0,xc1],[xe0,xe1]].forEach(([a,b])=>{ dimH(a,b,yn); ext(a,D+0.1,yn+0.15); ext(b,D+0.1,yn+0.15); });
    const xd=-0.7, xt=-1.3;
    const chainW=[[yH0,yK1],[yL0,yL1],...st.W.rooms.map(r=>[r.y,r.y+r.d]),[yM0,yM1]];
    chainW.forEach(([a,b])=>{ dimV(a,b,xd,false); extH(a,-0.1,xd-0.15); extH(b,-0.1,xd-0.15); });
    dimV(0,D,xt,false); extH(0,-0.1,xt-0.15); extH(D,-0.1,xt-0.15);
    const xe=W+0.7; const chainE=[[kitchen.y,yK1],[yL0,yL1],...st.E.rooms.map(r=>[r.y,r.y+r.d]),[yM0,yM1]];
    chainE.forEach(([a,b])=>{ dimV(a,b,xe,true); extH(a,W+0.1,xe+0.15); extH(b,W+0.1,xe+0.15); });
  }
  // kuzey oku
  { const nx=W+1.6, ny=D+0.6; line('A-ANNO',nx,ny-0.35,nx,ny+0.35); line('A-ANNO',nx,ny+0.35,nx-0.12,ny+0.1); line('A-ANNO',nx,ny+0.35,nx+0.12,ny+0.1); text('A-ANNO',nx,ny+0.45,0.2,'K'); }

  /* --- giriş sağda: tüm planı aynala --- */
  if(p.side==='right'){
    P.forEach(q=>{ switch(q.k){
      case 'rect': q.x=W-q.x-q.w; break;
      case 'line': q.x1=W-q.x1; q.x2=W-q.x2; break;
      case 'circle': q.cx=W-q.cx; break;
      case 'arc': { q.cx=W-q.cx; const a0=180-q.a1, a1=180-q.a0; q.a0=((a0%360)+360)%360; q.a1=((a1%360)+360)%360; break; }
      case 'text': q.x=W-q.x+(q.rot?q.s:0); break;
    }});
    L.rooms.forEach(r=>{ r.x=W-r.x-r.w; });
  }
  return {P,L,D,W};
}

/* ---------- SVG çıktısı (katman grupları id'li) ---------- */
function toSVG(model, opts){
  const {P,D,W}=model; const m=2.0; // kenar boşluğu (m)
  const vb=`${-m} ${-m} ${W+2*m} ${D+2*m}`;
  const Y=y=>D-y;
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const groups={};
  P.forEach(q=>{ (groups[q.l]=groups[q.l]||[]).push(q); });
  let out='';
  LAYERS.forEach(Ld=>{
    const items=groups[Ld.id]; if(!items) return;
    const hidden = !opts.export && S.hidden.has(Ld.id);
    const sw=Ld.lw/100*3; // mm çizgi kalınlığı → m ölçek (1:100 kağıtta okunur kalınlık)
    let g=`<g id="${Ld.id}" data-name="${esc(Ld.name)}" stroke="${Ld.color}" fill="none" stroke-width="${sw}" stroke-linecap="square"${hidden?' display="none"':''}>`;
    items.forEach(q=>{
      switch(q.k){
        case 'rect': g+=`<rect x="${q.x}" y="${Y(q.y+q.h)}" width="${q.w}" height="${q.h}"${q.fill?` fill="${Ld.color}" stroke="none"`:q.fillColor?` fill="${q.fillColor}" stroke="none"`:''}/>`; break;
        case 'line': g+=`<line x1="${q.x1}" y1="${Y(q.y1)}" x2="${q.x2}" y2="${Y(q.y2)}"/>`; break;
        case 'circle': g+=`<circle cx="${q.cx}" cy="${Y(q.cy)}" r="${q.r}"/>`; break;
        case 'arc': { const a0=q.a0*Math.PI/180,a1=q.a1*Math.PI/180; const x1=q.cx+q.r*Math.cos(a0),y1=q.cy+q.r*Math.sin(a0),x2=q.cx+q.r*Math.cos(a1),y2=q.cy+q.r*Math.sin(a1);
          g+=`<path d="M${x1} ${Y(y1)} A${q.r} ${q.r} 0 0 0 ${x2} ${Y(y2)}"/>`; break; }
        case 'text': g+=`<text x="${q.x}" y="${Y(q.y)}" font-size="${q.s}" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif" fill="${Ld.color}" stroke="none" text-anchor="${q.anchor}"${q.rot?` transform="rotate(${-q.rot} ${q.x} ${Y(q.y)})"`:''}>${esc(q.t)}</text>`; break;
      }
    });
    out+=g+'</g>';
  });
  const wmm=(W+2*m)*10, hmm=(D+2*m)*10; // 1:100
  const attrs = opts.export ? ` width="${wmm}mm" height="${hmm}mm"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${attrs}>${opts.export?`<desc>${esc(S.pname)} — tek kat şematik plan, ölçek 1:100, birim metre. Katman id'leri AutoCAD katman adlarıdır.</desc>`:''}${out}</svg>`;
}

/* ---------- DXF (R12, LINE/ARC/CIRCLE/TEXT, metre) ---------- */
function toDXF(model){
  const {P}=model; const f=v=>(+v).toFixed(4); const o=[];
  const push=(...a)=>o.push(...a);
  push('0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','9','$INSUNITS','70','6','0','ENDSEC');
  push('0','SECTION','2','TABLES','0','TABLE','2','LAYER','70',String(LAYERS.length));
  LAYERS.forEach(l=>push('0','LAYER','2',l.id,'70','0','62',String(l.aci),'6','CONTINUOUS'));
  push('0','ENDTAB','0','ENDSEC','0','SECTION','2','ENTITIES');
  const ln=(l,x1,y1,x2,y2)=>push('0','LINE','8',l,'10',f(x1),'20',f(y1),'30','0','11',f(x2),'21',f(y2),'31','0');
  P.forEach(q=>{
    switch(q.k){
      case 'rect': ln(q.l,q.x,q.y,q.x+q.w,q.y); ln(q.l,q.x+q.w,q.y,q.x+q.w,q.y+q.h); ln(q.l,q.x+q.w,q.y+q.h,q.x,q.y+q.h); ln(q.l,q.x,q.y+q.h,q.x,q.y);
        if(q.fill) ln(q.l,q.x,q.y,q.x+q.w,q.y+q.h); break; // duvar dolgusu için köşegen (hatch yerine işaret)
      case 'line': ln(q.l,q.x1,q.y1,q.x2,q.y2); break;
      case 'circle': push('0','CIRCLE','8',q.l,'10',f(q.cx),'20',f(q.cy),'30','0','40',f(q.r)); break;
      case 'arc': push('0','ARC','8',q.l,'10',f(q.cx),'20',f(q.cy),'30','0','40',f(q.r),'50',f(q.a0),'51',f(q.a1)); break;
      case 'text': { const w=q.t.length*q.s*0.55; const x=q.anchor==='middle'?(q.rot?q.x:q.x-w/2):q.x;
        push('0','TEXT','8',q.l,'10',f(x),'20',f(q.rot?q.y-w/2:q.y),'30','0','40',f(q.s),'1',q.t,'50',f(q.rot||0)); break; }
    }
  });
  push('0','ENDSEC','0','EOF');
  return o.join('\r\n');
}

/* ---------- PDF (jsPDF, A3 yatay, 1:100, renk kodlu) ---------- */
function toPDF(model){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a3'});
  const {P,D,W}=model; const sc=10; // 1 m = 10 mm
  const pw=420, ph=297; const drawW=(W+4)*sc, drawH=(D+4)*sc;
  const ox=(pw-70-drawW)/2+20, oy=(ph-drawH)/2+ (D+2)*sc; // sol-alt orijin
  const X=x=>ox+x*sc, Y=y=>oy-y*sc;
  const tr=t=>String(t).replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ı/g,'i').replace(/İ/g,'I');
  const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  doc.setLineCap('square');
  LAYERS.forEach(Ld=>{
    const col=hex(Ld.color); doc.setDrawColor(...col); doc.setFillColor(...col); doc.setTextColor(...col); doc.setLineWidth(Ld.lw);
    P.filter(q=>q.l===Ld.id).forEach(q=>{
      switch(q.k){
        case 'rect': if(q.fill) doc.rect(X(q.x),Y(q.y+q.h),q.w*sc,q.h*sc,'F');
          else if(q.fillColor){ doc.setFillColor(...hex(q.fillColor)); doc.rect(X(q.x),Y(q.y+q.h),q.w*sc,q.h*sc,'F'); doc.setFillColor(...col); }
          else doc.rect(X(q.x),Y(q.y+q.h),q.w*sc,q.h*sc,'S'); break;
        case 'line': doc.line(X(q.x1),Y(q.y1),X(q.x2),Y(q.y2)); break;
        case 'circle': doc.circle(X(q.cx),Y(q.cy),q.r*sc,'S'); break;
        case 'arc': { let a0=q.a0,a1=q.a1; if(a1<a0) a1+=360; const n=12; let px,py;
          for(let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; const x=X(q.cx+q.r*Math.cos(a)), y=Y(q.cy+q.r*Math.sin(a)); if(i) doc.line(px,py,x,y); px=x;py=y; } break; }
        case 'text': doc.setFont('helvetica','normal'); doc.setFontSize(q.s*sc*2.835);
          doc.text(tr(q.t),X(q.x),Y(q.y),{align:q.anchor==='middle'?'center':'left',angle:q.rot||0}); break;
      }
    });
  });
  // antet + katman lejantı
  const bx=pw-75, by=ph-10; doc.setDrawColor(27,27,27); doc.setLineWidth(0.3); doc.rect(bx,by-92,65,92,'S');
  doc.setTextColor(27,27,27); doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.text(tr(S.pname),bx+4,by-84);
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Tek kat sematik plan',bx+4,by-78); doc.text('Olcek 1:100 · A3 · birim m',bx+4,by-73);
  doc.text(new Date().toISOString().slice(0,10),bx+4,by-68);
  const net=model.L.rooms.reduce((s,r)=>s+r.area,0);
  doc.text(`Brut ${r2(W*D)} m²  ·  Net ${r2(net)} m²`,bx+4,by-63);
  doc.setFontSize(7.5); doc.text('KATMANLAR (AutoCAD adı · ACI renk)',bx+4,by-55);
  LAYERS.forEach((l,i)=>{ const yy=by-49+i*5.5; doc.setFillColor(...hex(l.color)); doc.rect(bx+4,yy-2.5,6,3,'F'); doc.setTextColor(27,27,27); doc.text(tr(`${l.id}  ·  ${l.name}  ·  ${l.aci}`),bx+12,yy); });
  return doc.output('blob');
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function readState(){
  S.beds=clamp(+$('beds').value||1,1,4); S.baths=clamp(+$('baths').value||1,1,2); S.wc=$('wc').checked; S.porch=$('porch').checked;
  S.W=clamp(+$('W').value||10,8,13); S.Dk=clamp(+$('Dk').value||3.6,3,4.5); S.Dl=clamp(+$('Dl').value||5.5,4,7.5);
  S.Db=clamp(+$('Db').value||3.6,3,4.5); S.Dm=clamp(+$('Dm').value||4.2,3.6,5.5);
  S.c=clamp(+$('c').value||1.3,1,2); S.te=clamp(+$('te').value||0.25,0.15,0.5); S.ti=clamp(+$('ti').value||0.1,0.08,0.25);
  S.furn=$('furn').checked; S.fills=$('fills').checked; S.dims=$('dims').checked; S.pname=$('pname').value||'Konut';
}
let MODEL=null;
function render(){
  readState(); MODEL=build(S);
  $('sheet').innerHTML=toSVG(MODEL,{export:false});
  $('warn').innerHTML=MODEL.L.warnings.map(w=>`<div>⚠ ${w}</div>`).join('');
  const rows=MODEL.L.rooms.filter(r=>r.id!=='COR').concat(MODEL.L.rooms.filter(r=>r.id==='COR'));
  let net=0; const tr=rows.map(r=>{ const a=r.area; net+=a; return `<tr><td><span class="sw" style="background:${ZONE_FILL[r.zone]}"></span>${r.name}</td><td>${r2(r.w)}×${r2(r.h)}</td><td>${a.toFixed(2)} m²</td></tr>`; }).join('');
  $('prog').innerHTML=tr+`<tr class="total"><td>Net toplam</td><td></td><td>${net.toFixed(2)} m²</td></tr><tr class="total"><td>Brüt (dış yüz)</td><td>${r2(S.W)}×${r2(MODEL.D)}</td><td>${r2(S.W*MODEL.D).toFixed(2)} m²</td></tr>`;
  $('status').textContent=`${S.W.toFixed(2)} × ${MODEL.D.toFixed(2)} m · ${S.beds}+1 · koridor ${MODEL.L.Lc.toFixed(2)} m · dışa aktarım 1:100`;
}
function buildLegend(){
  $('legend').innerHTML='<span>Katmanlar:</span>'+LAYERS.map(l=>`<label><input type="checkbox" data-l="${l.id}" checked><span class="sw" style="background:${l.color}"></span>${l.name} <code>${l.id}</code></label>`).join('');
  $('legend').querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{ if(i.checked) S.hidden.delete(i.dataset.l); else S.hidden.add(i.dataset.l); render(); }));
}
document.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S[seg.id]=b.dataset.v; render();
})));
document.querySelectorAll('aside input').forEach(i=>i.addEventListener('input',render));

/* ---------- İndirme ---------- */
let DL=null;
async function save(filename,data){
  if(!DL){ $('status').textContent='İndirme bu görünümde kullanılamıyor.'; return; }
  try{ await DL.save({filename,data}); $('status').textContent=`Kaydedildi: ${filename}`; }
  catch(e){ $('status').textContent = e&&e.code==='declined' ? 'İndirme iptal edildi.' : `İndirme başarısız: ${e&&e.message||e}`; }
}
const fname=ext=>`${S.pname.replace(/[^\w\-]+/g,'_')}_plan_${S.beds}+1.${ext}`;
$('btnSvg').onclick=()=>save(fname('svg'),toSVG(MODEL,{export:true}));
$('btnDxf').onclick=()=>save(fname('dxf.txt'),toDXF(MODEL));
$('btnPdf').onclick=()=>{ if(!window.jspdf){ $('status').textContent='PDF kütüphanesi yüklenemedi.'; return; } save(fname('pdf'),toPDF(MODEL)); };

buildLegend(); render();
if(window.claude&&window.claude.use){ claude.use('downloads').then(d=>{ DL=d; if(!d){ ['btnSvg','btnDxf','btnPdf'].forEach(id=>$(id).disabled=true); $('status').textContent+=' · indirme bu görünümde kapalı'; } }); }
else { ['btnSvg','btnDxf','btnPdf'].forEach(id=>$(id).disabled=true); }
</script>
